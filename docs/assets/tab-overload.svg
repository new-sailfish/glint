      <use href="#controls" x="701" y="26"/>
      <use href="#navigation" x="20" y="60"/>
      <rect x="105" y="47" width="526" height="25" rx="12" fill="#f8fafd"/>
      <text x="124" y="64" font-size="11" fill="#6b7f9a">github.com / example / project / issues</text>
      <rect x="650" y="47" width="128" height="25" rx="12" fill="#edf3fb"/>
      <circle cx="665" cy="59.5" r="7" fill="#2c61bd"/><text x="680" y="64" font-size="11" fill="#3d567a">Edge · 工作</text>
      <path d="M0 80h794" stroke="#c6d5e9"/>
      <text x="27" y="110" font-size="11" fill="#6b7f9a">项目 / 需求</text>
      <text x="27" y="146" font-size="23" font-weight="600" fill="#223043">产品设计需求</text>
      <rect x="27" y="163" width="58" height="23" rx="11" fill="#e2ecfc"/><text x="41" y="179" font-size="11" fill="#2c61bd">进行中</text>
      <path d="M27 209h447M27 231h500M27 253h358" stroke="#d1ddeb" stroke-width="5" stroke-linecap="round"/>
      <path d="M574 107v148" stroke="#e2e9f3"/>
      <text x="599" y="124" font-size="11" fill="#6b7f9a">项目资料</text>
      <path d="M599 147h129M599 175h108M599 203h138M599 231h92" stroke="#bdcde4" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
