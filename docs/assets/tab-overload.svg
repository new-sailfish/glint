      <rect width="790" height="330" rx="9" fill="#fff" stroke="#aebfd8"/>
      <path d="M9 0h772a9 9 0 0 1 9 9v70H0V9a9 9 0 0 1 9-9Z" fill="#e4ebf5"/>
