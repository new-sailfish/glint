      <path d="M9 0h758a9 9 0 0 1 9 9v70H0V9a9 9 0 0 1 9-9Z" fill="#dce6f5"/>
      <rect x="13" y="11" width="174" height="30" rx="5" fill="#fff"/>
      <rect x="24" y="20" width="12" height="12" rx="3" fill="#2c61bd"/>
      <text x="45" y="30" font-size="12" fill="#223043">产品设计评审</text>
      <g transform="translate(198 16)"><use href="#small-tab"/><use href="#small-tab" x="64"/><use href="#small-tab" x="128"/><use href="#small-tab" x="192"/><use href="#small-tab" x="256"/><use href="#small-tab" x="320"/><use href="#small-tab" x="384"/></g>
      <use href="#controls" x="683" y="26"/>
      <use href="#navigation" x="20" y="60"/>
      <rect x="105" y="47" width="508" height="25" rx="12" fill="#f7f9fd"/>
      <text x="124" y="64" font-size="11" fill="#6b7f9a">feishu.cn / docs / product-design</text>
      <rect x="629" y="47" width="132" height="25" rx="12" fill="#edf2f9"/>
      <circle cx="644" cy="59.5" r="7" fill="#2c61bd"/><text x="658" y="64" font-size="11" fill="#3d567a">Chrome · 工作</text>
      <path d="M0 80h776" stroke="#cfdbea"/>
      <path d="M0 81h153v256H9a9 9 0 0 1-9-9Z" fill="#f5f8fd"/>
      <text x="24" y="112" font-size="12" fill="#53657b">项目空间</text>
      <rect x="15" y="130" width="123" height="28" rx="4" fill="#e5edfa"/>
      <path d="M27 144h79M27 181h88M27 214h66M27 247h80" stroke="#b0c0d8" stroke-width="5" stroke-linecap="round"/>
      <text x="184" y="119" font-size="20" font-weight="600" fill="#223043">产品设计评审</text>
      <path d="M184 145h354M184 166h445M184 187h315" stroke="#d4deeb" stroke-width="5" stroke-linecap="round"/>
