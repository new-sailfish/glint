<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">标签页分散在多个浏览器窗口与配置文件中</title>
  <desc id="desc">操作场景示意，非产品截图。三个交错的窗口分别属于 Chrome 工作、Chrome 个人和 Edge 工作配置文件，每个窗口都有密集的标签页；前方窗口显示一份产品设计文档。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="125%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#47628a" flood-opacity=".12"/></filter>
    <g id="small-tab"><path d="M0 0V22" stroke="#bbcbe2"/><rect x="10" y="5" width="11" height="11" rx="3" fill="#96acd0"/><path d="M28 8h21M28 14h14" stroke="#8ba1c3" stroke-width="2" stroke-linecap="round"/></g>
    <g id="controls" fill="none" stroke="#7185a4" stroke-width="1.3"><path d="M0 0h10M30-4h9v9h-9zM61-4l9 9m0-9-9 9"/></g>
    <g id="navigation" fill="none" stroke="#8294ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 0H0l4-4M0 0l4 4M27 0h10l-4-4M37 0l-4 4M63-5a6 6 0 1 0 3 8M63-5v5h-5"/></g>
  </defs>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
