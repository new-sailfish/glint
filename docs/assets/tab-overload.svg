      <circle cx="657" cy="59.5" r="7" fill="#6984ae"/><text x="671" y="64" font-size="11" fill="#3d567a">Chrome · 个人</text>
      <path d="M0 80h790" stroke="#cfdbea"/>
      <text x="25" y="116" font-size="22" font-weight="600" fill="#223043">CSS Grid</text>
      <path d="M25 142h497M25 165h401M25 188h454" stroke="#d4deeb" stroke-width="5" stroke-linecap="round"/>
      <rect x="592" y="103" width="173" height="170" rx="4" fill="#f0f4fa"/>
      <path d="M612 127h110M612 155h122M612 183h86M612 211h106" stroke="#b9c8df" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Edge / work: its active page remains elsewhere. -->
    <g transform="translate(70 359)" filter="url(#shadow)">
      <rect width="794" height="277" rx="9" fill="#fff" stroke="#9eb4d3"/>
      <path d="M9 0h776a9 9 0 0 1 9 9v70H0V9a9 9 0 0 1 9-9Z" fill="#d3e1f5"/>
