name: Build Glint

on:
  push:
    branches: [master, main]
    paths-ignore: ['**/*.md', 'docs/**', 'site/**', '.github/workflows/pages.yml', '.superpowers/**', '.playwright-mcp/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'site/**', '.github/workflows/pages.yml', '.superpowers/**', '.playwright-mcp/**']
  workflow_dispatch:

concurrency:
  group: glint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    # Match the Visual Studio 2022 generator in CMakePresets.json.
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test development and release scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/tests/*.test.ps1 | Sort-Object Name | ForEach-Object {
            & pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Script tests failed: $($_.Name)" }
          }
  windows-preview:
    if: github.event_name == 'pull_request'
    needs: script-tests
    # Match the Visual Studio 2022 generator in CMakePresets.json.
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Release x64
        run: cmake --preset release
      - name: Build Release x64
        run: cmake --build --preset release --parallel
      - name: Test core and native protocol targets
        run: ctest --preset release --output-on-failure --no-tests=error -LE desktop
      - name: Test browser extension
        run: npm --prefix extension test
  windows-release:
    if: github.event_name != 'pull_request'
    needs: script-tests
    # Match the Visual Studio 2022 generator in CMakePresets.json.
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep allocation in this job so rerunning a failed build reserves again.
      - name: Reserve official build version
        id: reserve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\reserve-ci-version.ps1
      - name: Configure Release x64
        run: cmake --preset release
      - name: Build Release x64
        env:
          GLINT_CI_VERSION: ${{ steps.reserve.outputs.version }}
        run: cmake --build --preset release --parallel
      - name: Test core and native protocol targets
        run: ctest --preset release --output-on-failure --no-tests=error -LE desktop
      - name: Test browser extension
        run: npm --prefix extension test
      - name: Check native imports
        shell: pwsh
        run: .\scripts\check-imports.ps1 -Binary .\build\release\Release\Glint.exe
      - name: Package and verify Release
        shell: pwsh
        run: .\scripts\package-release.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.reserve.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Glint ${{ steps.reserve.outputs.version }}
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          body: |
            - **Glint.exe**: standalone Windows x64 application.
            - **Glint-win-x64.zip**: full package with documentation and browser extension files.
            - **release-manifest.json**: version, source commit, and SHA-256 hashes.

            Built from `${{ github.sha }}` in [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          files: |
            dist/Glint.exe
            Glint-win-x64.zip
            dist/release-manifest.json
      - name: Publish verified update mirrors
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GLINT_RELEASE_VERSION: ${{ steps.reserve.outputs.version }}
        run: .\scripts\publish-update-feed.ps1 -Version $env:GLINT_RELEASE_VERSION -Commit $env:GITHUB_SHA
