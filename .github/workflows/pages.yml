name: Publish product site

on:
  push:
    branches: [master, main]
    paths: ['site/**', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # A token-authenticated feed push does not trigger another workflow. Publish
  # updates only after the official build (including feed publication) succeeds.
  workflow_run:
    workflows: ['Build Glint']
    types: [completed]
    branches: [master, main]

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test website language behavior
        run: node --test site/*.test.js
      - name: Prepare static site
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site/assets -Force | Out-Null
          Copy-Item site/index.html, site/styles.css, site/app.js, site/i18n.js -Destination _site
          Copy-Item docs/assets/* -Destination _site/assets
          New-Item -ItemType File -Path _site/.nojekyll -Force | Out-Null
      - name: Stage verified update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-update-feed.ps1 -Mode Stage -SiteDirectory .\_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
