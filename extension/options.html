<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glint profile</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    input { box-sizing: border-box; width: 100%; padding: .55rem; }
    button { margin-top: 1rem; padding: .5rem .9rem; }
    #status { min-height: 1.4em; margin-top: .8rem; }
  </style>
</head>
<body>
  <h1>Glint browser profile</h1>
  <p>Give this browser profile an optional label shown in Glint search results. Glint never reads page contents.</p>
  <form id="profile-form">
    <label for="profile-label">Profile label</label>
    <input id="profile-label" name="profileLabel" maxlength="80" autocomplete="off" placeholder="e.g. Work">
    <button type="submit">Save</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
